version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: awip-postgres
    ports:
      - "6432:5432"
    environment:
      POSTGRES_USER: awip_admin
      POSTGRES_PASSWORD: awip_password
      POSTGRES_DB: awip_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - awip-network

  server-core:
    build:
      context: ./server-core
      dockerfile: Dockerfile
    container_name: awip-server-core
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://awip_admin:awip_password@database:5432/awip_db
    depends_on:
      - database
    networks:
      - awip-network

  server-ai:
    build:
      context: ./server-ai
      dockerfile: Dockerfile
    container_name: awip-server-ai
    ports:
      - "8000:8000"
    networks:
      - awip-network

volumes:
  pgdata:

networks:
  awip-network:
    driver: bridge
