# Production compose for AWIP on a shared host, served behind nginx at /awip/.
# Usage: docker compose -p awip -f docker-compose.prod.yml up -d
# Required env (put in .env next to this file, chmod 600, never commit):
#   POSTGRES_PASSWORD, JWT_SECRET, ZAI_API_KEY (optional — AI features degrade without it)
# All host ports bind to loopback only; nginx terminates TLS and proxies:
#   /awip/          -> 127.0.0.1:8097 (SSR web)
#   /awip/core-api/ -> 127.0.0.1:8098 (server-core)
#   /awip/ai-api/   -> 127.0.0.1:8099 (server-ai)
name: awip

services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: awip_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: awip_db
    ports:
      - "127.0.0.1:5497:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awip_admin -d awip_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  server-core:
    build:
      context: ./server-core
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://awip_admin:${POSTGRES_PASSWORD}@database:5432/awip_db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_API_URL: http://server-ai:8000
    ports:
      - "127.0.0.1:8098:5000"
    depends_on:
      database:
        condition: service_healthy

  server-ai:
    build:
      # Repo root context: the image needs both server-ai/ and kb-extract-rig/
      # (document_extract.py imports the sibling rig directory).
      context: .
      dockerfile: server-ai/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://awip_admin:${POSTGRES_PASSWORD}@database:5432/awip_db
      JWT_SECRET: ${JWT_SECRET}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.7}
    ports:
      - "127.0.0.1:8099:8000"
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_BASE_PATH: /awip/
        VITE_CORE_API_URL: /awip/core-api
        VITE_AI_API_URL: /awip/ai-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:3000"

volumes:
  pgdata:

networks:
  # Explicit subnet: the prod host has exhausted Docker's default 172.x/192.168.x
  # address pools (~30 compose networks). 10.87.0.0/24 is unused there and clear
  # of the EC2 VPC range (172.31.0.0/20).
  default:
    ipam:
      config:
        - subnet: 10.87.0.0/24
